[module "v4l2loopback"]
detect = package:v4l2loopback-kmp-*
module = v4l2loopback
initrd = optional
severity = warning
scope = important

[module "storage_driver"]
detect = package:storage_driver-kmp-*
module = storage_driver
initrd = required
severity = boot-risk
scope = all

[module "early_kms_driver"]
detect = package:early-kms-driver-kmp-*
module = early_kms_driver
initrd = auto
severity = boot-risk
scope = next-boot

[module "unused_vendor_module"]
enabled = false
