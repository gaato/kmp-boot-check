[module "v4l2loopback"]
detect = package:v4l2loopback-kmp-*
module = v4l2loopback
initrd = optional
severity = warning
scope = important

[module "storage_driver"]
detect = package:storage_driver-kmp-*
module = storage_driver
initrd = required
severity = boot-risk
scope = all

[module "unused_vendor_module"]
enabled = false
